<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Menghitung Luas Bangun Datar</title>
</head>
<body>

    <h1>Kalkulator Luas Bangun Datar</h1>
    <p>Buka console browser (F12 -> Console) untuk melihat hasil eksekusi program.</p>

    <script>
        // Fungsi untuk menghitung luas persegi panjang
        // Formula: panjang * lebar
        function hitungLuasPersegiPanjang(panjang, lebar) {
            let luas = panjang * lebar; // Menghitung luas menggunakan operator perkalian (*)
            return luas;
        }

        // Fungsi untuk menghitung luas bujur sangkar (persegi)
        // Formula: sisi * sisi
        function hitungLuasBujurSangkar(sisi) {
            let luas = sisi * sisi; // Menghitung luas menggunakan operator perkalian (*)
            return luas;
        }

        // Fungsi untuk menghitung luas segitiga
        // Formula: 0.5 * alas * tinggi
        function hitungLuasSegitiga(alas, tinggi) {
            let luas = 0.5 * alas * tinggi; // Menghitung luas menggunakan operator perkalian (*)
            return luas;
        }

        // Deklarasi variabel input
        let panjangPP = 10;
        let lebarPP = 5;

        let sisiBujurSangkar = 8;

        let alasSegitiga = 12;
        let tinggiSegitiga = 6;

        // Pemanggilan fungsi dan penyimpan hasil ke variabel
        let luasPP = hitungLuasPersegiPanjang(panjangPP, lebarPP);
        let luasBS = hitungLuasBujurSangkar(sisiBujurSangkar);
        let luasST = hitungLuasSegitiga(alasSegitiga, tinggiSegitiga);

        // Menampilkan output ke console
        console.log("=== HARSIL PERHITUNGAN LUAS BANGUN DATAR ===");
        console.log("1. Persegi Panjang (p=" + panjangPP + ", l=" + lebarPP + ") = " + luasPP);
        console.log("2. Bujur Sangkar (s=" + sisiBujurSangkar + ") = " + luasBS);
        console.log("3. Segitiga (a=" + alasSegitiga + ", t=" + tinggiSegitiga + ") = " + luasST);
    </script>

</body>
</html>
